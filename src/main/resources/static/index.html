<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reactive Zabbix Mini Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>&#x1F4BB; Server Monitoring Dashboard</h1>
            <p class="subtitle">Reactive Zabbix Mini Dashboard &mdash; Multi-Host</p>
            <span id="last-updated" class="timestamp">Waiting for data&hellip;</span>
        </header>

        <main id="hosts-container">
            <!-- Host panels are injected by dashboard.js -->
        </main>

        <footer>
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Connecting&hellip;</span>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
