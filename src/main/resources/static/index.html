<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reactive Zabbix Mini Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>&#x1F4BB; Server Monitoring Dashboard</h1>
            <p class="subtitle">Reactive Zabbix Mini Dashboard</p>
            <span id="last-updated" class="timestamp">Waiting for data&hellip;</span>
        </header>

        <main>
            <!-- CPU -->
            <section class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">&#x2699;&#xFE0F;</span>
                    <span class="metric-label">CPU Usage</span>
                    <span id="cpu-value" class="metric-value">--%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="cpu-bar" class="progress-bar cpu"></div>
                </div>
            </section>

            <!-- RAM -->
            <section class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">&#x1F9E0;</span>
                    <span class="metric-label">Memory Usage</span>
                    <span id="ram-value" class="metric-value">--%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="ram-bar" class="progress-bar ram"></div>
                </div>
            </section>

            <!-- DISK -->
            <section class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">&#x1F4BE;</span>
                    <span class="metric-label">Disk Usage</span>
                    <span id="disk-value" class="metric-value">--%</span>
                </div>
                <div class="progress-bar-track">
                    <div id="disk-bar" class="progress-bar disk"></div>
                </div>
            </section>

            <!-- NETWORK -->
            <section class="metric-card network-card">
                <div class="metric-header">
                    <span class="metric-icon">&#x1F4F6;</span>
                    <span class="metric-label">Network</span>
                </div>
                <div class="network-row">
                    <div class="net-direction">
                        <span class="net-arrow">&#x25BC;</span>
                        <span class="net-dir-label">IN</span>
                        <span id="net-in-value" class="metric-value">-- Mbps</span>
                    </div>
                    <div class="net-divider"></div>
                    <div class="net-direction">
                        <span class="net-arrow up">&#x25B2;</span>
                        <span class="net-dir-label">OUT</span>
                        <span id="net-out-value" class="metric-value">-- Mbps</span>
                    </div>
                </div>
                <div class="progress-bar-track">
                    <div id="net-in-bar"  class="progress-bar net-in"  title="Network IN"></div>
                </div>
                <div class="progress-bar-track" style="margin-top:6px;">
                    <div id="net-out-bar" class="progress-bar net-out" title="Network OUT"></div>
                </div>
            </section>
            <section class="graphs">
                <h2>Graphs (last ~5 minutes)</h2>

                <div class="graph">
                    <div class="graph-title">CPU (%)</div>
                    <canvas id="cpu-chart" width="800" height="160"></canvas>
                </div>

                <div class="graph">
                    <div class="graph-title">RAM (%)</div>
                    <canvas id="ram-chart" width="800" height="160"></canvas>
                </div>

                <div class="graph">
                    <div class="graph-title">Disk (%)</div>
                    <canvas id="disk-chart" width="800" height="160"></canvas>
                </div>

                <div class="graph">
                    <div class="graph-title">Network IN (Mbps)</div>
                    <canvas id="netin-chart" width="800" height="160"></canvas>
                </div>

                <div class="graph">
                    <div class="graph-title">Network OUT (Mbps)</div>
                    <canvas id="netout-chart" width="800" height="160"></canvas>
                </div>
            </section>
        </main>

        <footer>
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Connecting&hellip;</span>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
