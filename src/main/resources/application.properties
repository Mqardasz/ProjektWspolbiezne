# ──────────────────────────────────────────────
#  Zabbix connection settings
#  Update these values to match your environment
# ──────────────────────────────────────────────
zabbix.api.url=http://localhost:8080/dummy-zabbix/api_jsonrpc.php
zabbix.api.user=Admin
zabbix.api.password=zabbix

# Comma-separated list of Zabbix host names to monitor concurrently.
# Example for a real Zabbix installation: zabbix.host.names=prod-server,backup-server,db-server
zabbix.host.names=Zabbix server,Host Alpha,Host Beta

# Server port
server.port=8080

# Logging (set to DEBUG to trace metric updates)
logging.level.org.example=INFO
